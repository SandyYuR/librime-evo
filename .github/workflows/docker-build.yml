name: Docker build
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - name: Checkout last commit
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build with plugins
      run: |
        luajit_release=$(git -C plugins/lua/thirdparty/luajit log -1 --format=%ct)
        docker build --build-arg LUAJIT_RELVER="$luajit_release" -t librime .
